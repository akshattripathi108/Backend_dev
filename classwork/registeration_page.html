<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f8f9fa;font-family:Arial;}
.card{max-width:400px;margin:80px auto;padding:25px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Tripathi&Sons</a>
  </div>
</nav>
<div class="container">
  <div class="card">
    <h3 class="text-center mb-3">Register</h3>
    <form id="registerForm">
      <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="Username" required>
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="Number" id="phone" class="form-control" placeholder="Phone no." required>
      </div>
      <div class="mb-3">
        <input type="date" id="dob" class="form-control" placeholder="Date-Of-Birth" required>
      </div>
      <div class="mb-3">
        <input type="password" id="password" class="form-control" placeholder="Password" required>
      </div>
      <div class="mb-3">
        <input type="text" id="cnf_password" class="form-control" placeholder="Confirm Password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
  </div>
</div>
<!-- Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-3">
      <h5 class="modal-title mb-2">Registration Successful</h5>
      <p id="welcomeMessage" class="text-muted"></p>
      <button type="button" class="btn btn-success mt-2" data-bs-dismiss="modal">OK</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit',e=>{
  e.preventDefault();
  const username=document.getElementById('username').value;
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  if(username&&email&&pass){
    document.getElementById('welcomeMessage').textContent="Welcome, "+username+"!";
    new bootstrap.Modal('#registerModal').show();
  }else alert('Please fill all fields');
});
</script>
</body>
</html>
