<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Javascript vs Jquery</h1>
    <button id="jsbutton">Javascript Change</button>
    <button id="jqbutton">Jquery Change</button>
    <div id="box" style="width:300px; height:300px; background-color:lightgrey; margin-top:20px;">
        This is a box containing some text.
    </div>
    <script src="/jquery.min.js"></script>
    <script>
        document.getElementById("jsbutton").addEventListener("click", function() {
            var box = document.getElementById("box");
            box.style.backgroundColor = "lightblue";
            box.innerHTML = "Changed by Javascript!";
        });

        $("#jqbutton").click(function() {
            $("#box").css("background-color", "lightgreen");
            $("#box").html("Changed by jQuery!");
        });
    </script>
</body>
